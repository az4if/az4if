name: Update Guestbook

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'badges/**'
      - 'github-metrics.svg'
  schedule:
    - cron: "10 * * * *"   # every hour, offset :10 so it doesn't collide with metrics (:00) or update-readme (:20/:50)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writes
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: joshmgross/guestbook@main
        with:
          issue: 1
          # the guestbook issue must be Issue #1 in this repo
          # Only comments from users listed below get pulled into the README
          approvers: |
            az4if
          guestbook-path: README.md
      - name: Commit guestbook update
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "${{ github.actor }}"
            git add README.md
            git commit -m "✏ Update guestbook"
            git pull --rebase origin main
            git push
          fi
