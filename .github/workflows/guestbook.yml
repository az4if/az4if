name: Update Guestbook

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */1 * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: joshmgross/guestbook@main
        with:
          issue: 1              # the guestbook issue must be Issue #1 in this repo
          approvers: |
            az4if                # only comments from users listed here get pulled into the README
          guestbook-path: README.md
      - name: Commit guestbook update
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "${{ github.actor }}"
            git add README.md
            git commit -m "✏ Update guestbook"
            git push
          fi
