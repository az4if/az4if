# Full plugin reference: https://github.com/lowlighter/metrics#-documentation
name: Metrics

on:
  schedule: [{cron: "0 * * * *"}]   # every hour
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Personal access token — see SETUP_GUIDE.md for how to create this
          # and add it as a repo secret named METRICS_TOKEN.
          # Required scope: public_repo (or repo). Optional: read:org, read:user.
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          debug: yes   # TEMP: prints full per-plugin error detail in the Actions log - remove once fixed

          # --- Core ---
          user: az4if
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_octicon: yes
          config_timezone: Europe/London
          config_twemoji: yes

          # --- Achievements ---
          # TEMPORARILY DISABLED: the plugin's mandatory setup query still requests GitHub's
          # now-fully-removed "Projects (classic)" API and hard-crashes. This isn't something
          # plugin_achievements_ignored can route around (that only filters AFTER the setup
          # query succeeds). There's an open, unmerged upstream PR ("Migrate Achievements
          # plugin to Projects V2 API") that fixes this properly - re-enable once a metrics
          # release ships with it. Check https://github.com/lowlighter/metrics/releases
          plugin_achievements: no
          # plugin_achievements_display: detailed
          # plugin_achievements_secrets: yes
          # plugin_achievements_threshold: C

          # --- Recent activity ---
          plugin_activity: yes
          plugin_activity_days: 14
          # Reverted to "all" - narrowing this to exclude push did NOT fix the crash,
          # so it isn't event-type related after all.
          plugin_activity_filter: all
          plugin_activity_limit: 3
          plugin_activity_load: 300
          plugin_activity_visibility: all
          # az4if/mini-dep-bot: didn't fully fix it on its own, kept anyway (still low-risk)
          # Fribb/anime-lists: BEST GUESS based on debug log - "anime-lists" was the last repo
          # filtered right before the crash, in both debug runs. CONFIRM THE REAL OWNER before
          # trusting this - check github.com/az4if?tab=overview for recent anime-lists activity.
          plugin_activity_skipped: az4if/mini-dep-bot, Fribb/anime-lists

          # --- AniList (your currently-watching anime) ---
          plugin_anilist: yes
          plugin_anilist_limit: 4
          plugin_anilist_limit_characters: 22
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: watching, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: Az4iF   # TODO: confirm this is your real AniList username

          # --- Coding habits ---
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          # mini-dep-bot's automated commits crash this plugin (unattributed bot author) - skip it.
          # Also added Fribb/anime-lists (same guess as activity - Habits shows the identical
          # "Cannot destructure property 'author' of 'undefined'" crash, so may share a cause)
          plugin_habits_skipped: az4if/mini-dep-bot, Fribb/anime-lists

          # --- Contribution calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # --- Languages ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_ignored: json, xml, tsv, text, html, yaml
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_threshold: 0%

          # --- Lines changed ---
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          # mini-dep-bot's automated commits crash this plugin (unattributed bot author),
          # which in turn crashes the whole render (this is THE fix for the hang) - skip it
          plugin_lines_skipped: az4if/mini-dep-bot

          # --- Pinned/starred repos ---
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_repositories_pinned: 3
          plugin_repositories_random: 2
          plugin_repositories_starred: 1

          # --- Last.fm "recently played" plugin ---
          # Requires repo secret LASTFM_API_KEY (see SETUP_GUIDE.md)
          plugin_music: yes
          plugin_music_limit: 4
          plugin_music_mode: recent
          plugin_music_provider: lastfm
          plugin_music_time_range: short
          plugin_music_token: ${{ secrets.LASTFM_API_KEY }}
          plugin_music_user: az4if

          # --- Steam plugin ---
          # Requires repo secret STEAM_TOKEN (see SETUP_GUIDE.md)
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_achievements_limit: 1
          plugin_steam_games_limit: 1
          plugin_steam_playtime_threshold: 2
          plugin_steam_recent_games_limit: 1
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: "76561198376154372"
