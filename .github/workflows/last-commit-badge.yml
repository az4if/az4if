name: Update Last Commit Badge

on:
  schedule:
    - cron: '3-59/5 * * * *'   # every 5 minutes, offset by 3 (:03,:08,...,:58) so it never lands on the same minute as guestbook/metrics/update-readme
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: main-branch-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Refresh "last commit" badge

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute time since last commit
        id: since
        run: |
          now=$(date -u +%s)
          last=$(git log -1 --format=%ct)
          diff=$(( now - last ))

          if   [ $diff -lt 60 ];      then msg="just now"
          elif [ $diff -lt 3600 ];    then m=$(( diff / 60 ));   [ $m -eq 1 ] && msg="$m minute ago" || msg="$m minutes ago"
          elif [ $diff -lt 86400 ];   then h=$(( diff / 3600 )); [ $h -eq 1 ] && msg="$h hour ago"   || msg="$h hours ago"
          elif [ $diff -lt 2592000 ]; then d=$(( diff / 86400 )); [ $d -eq 1 ] && msg="$d day ago"   || msg="$d days ago"
          else mo=$(( diff / 2592000 )); [ $mo -eq 1 ] && msg="$mo month ago" || msg="$mo months ago"
          fi

          mkdir -p badges
          printf '{"schemaVersion":1,"label":"Last Commit","message":"%s","color":"7C3AED"}\n' "$msg" > badges/last-commit.json

      - name: Commit changes
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "github-actions[bot]"
            git add badges/last-commit.json
            git commit -m "🔄 Update last-commit badge"
            git pull --rebase origin main
            git push
          fi
