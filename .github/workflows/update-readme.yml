name: Update README - Recent Activity

on:
  schedule:
    - cron: '20,50 * * * *'   # every 30 minutes, offset :20/:50 so it doesn't land on metrics' (:00) or guestbook's (:10) slot
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: main-branch-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with recent GitHub activity

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "${{ github.actor }}"
            git add README.md
            git commit -m "🔄 Update recent activity"
            git pull --rebase origin main
            git push
          fi
